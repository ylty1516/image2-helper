<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Background Gets Equal Quality Support</title>
  <desc id="desc">A visual case map showing that background and non-focus details should receive the same quality scrutiny as the focal subject.</desc>
  <defs>
    <style>
      .bg { fill: #f6f3ed; }
      .panel { fill: #ffffff; stroke: #1f2933; stroke-width: 2; }
      .panel-soft { fill: #eef6f8; stroke: #1f2933; stroke-width: 2; }
      .title { font: 700 36px Arial, sans-serif; fill: #172026; letter-spacing: 0; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5560; letter-spacing: 0; }
      .h2 { font: 700 22px Arial, sans-serif; fill: #172026; letter-spacing: 0; }
      .body { font: 400 15px Arial, sans-serif; fill: #34404a; letter-spacing: 0; }
      .small { font: 400 13px Arial, sans-serif; fill: #46535f; letter-spacing: 0; }
      .label { font: 700 13px Arial, sans-serif; fill: #172026; letter-spacing: 0; }
      .bad { fill: #d95f5f; }
      .good { fill: #2f9e75; }
      .line { stroke: #26323a; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #596774; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #d95f5f; stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 8 7; }
      .shadow { fill: #ccd6dd; opacity: .45; }
      .sky { fill: #d9edf3; }
      .warm { fill: #f7c66f; }
      .cool { fill: #74a7bf; }
      .ink { fill: #172026; }
      .muted { fill: #9fb1ba; }
      .prompt { fill: #172026; }
      .promptText { font: 400 14px Consolas, 'Courier New', monospace; fill: #eef6f8; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="title" x="48" y="58">Background Gets Equal Quality Support</text>
  <text class="subtitle" x="48" y="88">The focal subject can lead the composition, but the background must be just as real, rich, and logically constructed.</text>

  <rect class="panel" x="48" y="120" width="355" height="410" rx="8"/>
  <rect class="panel-soft" x="442" y="120" width="395" height="410" rx="8"/>
  <rect class="panel" x="876" y="120" width="355" height="410" rx="8"/>

  <text class="h2" x="72" y="158">Common AI Failure</text>
  <text class="body" x="72" y="184">Main subject polished, background treated as filler.</text>

  <rect class="sky" x="75" y="210" width="306" height="110" rx="6"/>
  <path class="dash" d="M90 315 C132 260, 170 360, 214 292 S305 285, 364 244"/>
  <path class="dash" d="M98 252 L134 220 L150 318 L112 318 Z"/>
  <path class="dash" d="M258 245 L290 225 L337 315 L274 315 Z"/>
  <rect class="muted" x="112" y="330" width="235" height="88" rx="4"/>
  <line class="thin" x1="112" y1="370" x2="347" y2="350"/>
  <line class="thin" x1="112" y1="402" x2="347" y2="365"/>

  <ellipse class="shadow" cx="225" cy="456" rx="76" ry="16"/>
  <circle class="warm" cx="225" cy="322" r="35"/>
  <path class="ink" d="M198 322 C196 292, 216 278, 244 287 C260 296, 263 325, 252 345 C239 367, 202 358, 198 322Z" opacity=".18"/>
  <path class="line" d="M195 375 C206 350, 246 350, 258 375 L270 448 L183 448 Z"/>
  <line class="line" x1="204" y1="448" x2="194" y2="490"/>
  <line class="line" x1="248" y1="448" x2="264" y2="490"/>
  <line class="line" x1="207" y1="392" x2="170" y2="418"/>
  <line class="line" x1="254" y1="392" x2="288" y2="412"/>

  <circle class="bad" cx="110" cy="430" r="11"/>
  <path class="dash" d="M110 442 L96 480 M110 442 L126 482 M110 454 L77 448 M110 454 L140 470 M110 454 L95 430"/>
  <circle class="bad" cx="327" cy="432" r="11"/>
  <path class="dash" d="M327 443 L318 488 M327 443 L356 475 M327 455 L300 478 M327 455 L352 456"/>
  <text class="label bad" x="74" y="512">Broken background people</text>
  <text class="label bad" x="223" y="512">Warped objects</text>

  <text class="h2" x="466" y="158">Integrity Check</text>
  <text class="body" x="466" y="184">Same realism standard across every visible layer.</text>

  <rect x="468" y="216" width="338" height="290" rx="8" fill="#ffffff" stroke="#c6d2d9"/>
  <circle class="good" cx="494" cy="250" r="7"/>
  <text class="label" x="514" y="255">Coherent perspective and scale</text>
  <line class="thin" x1="494" y1="270" x2="494" y2="286"/>
  <circle class="good" cx="494" cy="305" r="7"/>
  <text class="label" x="514" y="310">Plausible secondary figures</text>
  <line class="thin" x1="494" y1="325" x2="494" y2="341"/>
  <circle class="good" cx="494" cy="360" r="7"/>
  <text class="label" x="514" y="365">Real object function and material</text>
  <line class="thin" x1="494" y1="380" x2="494" y2="396"/>
  <circle class="good" cx="494" cy="415" r="7"/>
  <text class="label" x="514" y="420">Shared light, shadow, and contact</text>
  <line class="thin" x1="494" y1="435" x2="494" y2="451"/>
  <circle class="good" cx="494" cy="470" r="7"/>
  <text class="label" x="514" y="475">Rich lived-in environmental detail</text>

  <path class="thin" d="M470 216 L806 506"/>
  <path class="thin" d="M806 216 L470 506"/>
  <text class="small" x="528" y="225">No lower-quality background pass</text>
  <text class="small" x="526" y="497">Softness may vary, construction quality does not</text>

  <text class="h2" x="900" y="158">Convincing Scene</text>
  <text class="body" x="900" y="184">Background is rich and believable, not simplified away.</text>

  <rect class="sky" x="900" y="210" width="306" height="110" rx="6"/>
  <path fill="#e7eef0" stroke="#26323a" stroke-width="2" d="M915 318 L915 250 L980 230 L980 318 Z"/>
  <path fill="#d5e1e5" stroke="#26323a" stroke-width="2" d="M990 318 L990 238 L1080 256 L1080 318 Z"/>
  <path fill="#c8d7dd" stroke="#26323a" stroke-width="2" d="M1094 318 L1094 224 L1192 246 L1192 318 Z"/>
  <g stroke="#596774" stroke-width="1.5">
    <line x1="930" y1="265" x2="965" y2="255"/>
    <line x1="930" y1="287" x2="965" y2="278"/>
    <line x1="1010" y1="258" x2="1065" y2="270"/>
    <line x1="1010" y1="285" x2="1065" y2="292"/>
    <line x1="1112" y1="250" x2="1174" y2="263"/>
    <line x1="1112" y1="278" x2="1174" y2="286"/>
  </g>
  <rect fill="#9fb1ba" x="900" y="330" width="306" height="88" rx="4"/>
  <line class="thin" x1="900" y1="369" x2="1206" y2="350"/>
  <line class="thin" x1="900" y1="402" x2="1206" y2="365"/>

  <ellipse class="shadow" cx="1040" cy="456" rx="76" ry="16"/>
  <circle class="warm" cx="1040" cy="322" r="35"/>
  <path class="line" d="M1010 375 C1021 350, 1061 350, 1073 375 L1085 448 L998 448 Z"/>
  <line class="line" x1="1019" y1="448" x2="1010" y2="490"/>
  <line class="line" x1="1063" y1="448" x2="1078" y2="490"/>
  <line class="line" x1="1022" y1="392" x2="990" y2="418"/>
  <line class="line" x1="1069" y1="392" x2="1100" y2="412"/>

  <g>
    <circle class="good" cx="936" cy="428" r="10"/>
    <line class="line" x1="936" y1="440" x2="936" y2="478"/>
    <line class="line" x1="936" y1="450" x2="920" y2="463"/>
    <line class="line" x1="936" y1="450" x2="955" y2="460"/>
    <line class="line" x1="936" y1="478" x2="923" y2="493"/>
    <line class="line" x1="936" y1="478" x2="950" y2="493"/>
  </g>
  <g>
    <circle class="good" cx="1160" cy="430" r="10"/>
    <line class="line" x1="1160" y1="442" x2="1158" y2="479"/>
    <line class="line" x1="1158" y1="452" x2="1140" y2="459"/>
    <line class="line" x1="1158" y1="452" x2="1174" y2="467"/>
    <line class="line" x1="1158" y1="479" x2="1146" y2="493"/>
    <line class="line" x1="1158" y1="479" x2="1172" y2="493"/>
  </g>
  <rect fill="#f7c66f" stroke="#26323a" stroke-width="2" x="1130" y="352" width="54" height="27" rx="3"/>
  <text class="label good" x="910" y="512">Natural secondary figures</text>
  <text class="label good" x="1086" y="512">Rich lived-in background</text>

  <path class="line" d="M407 325 L433 325"/>
  <path class="line" d="M837 325 L865 325"/>
  <path class="line" d="M432 325 L424 317 M432 325 L424 333"/>
  <path class="line" d="M864 325 L856 317 M864 325 L856 333"/>

  <rect class="prompt" x="48" y="570" width="1183" height="112" rx="8"/>
  <text class="promptText" x="72" y="604">Scene integrity: the focal subject remains compositionally primary, but the background is generated with equal quality support:</text>
  <text class="promptText" x="72" y="630">rich, realistic, structurally plausible objects and secondary figures, aligned to the same perspective and light, with no</text>
  <text class="promptText" x="72" y="656">melted props, malformed crowd figures, fake text, or bizarre unrelated actions.</text>
</svg>
